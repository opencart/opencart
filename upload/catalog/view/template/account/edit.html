<div class="modal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5>{{ heading_title }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form-submit @ref="form" @custom-submit="handleSubmit">
          <template>
            <div @ref="alert"></div>
            <fieldset>
              <legend>{{ text_your_details }}</legend>
              <div class="mb-3">
                <form-label for="input-firstname">{{ entry_firstname }}</form-label>
                <input-text id="input-firstname" label="{{ entry_firstname }}" name="firstname" value="{{ firstname }}" required></input-text>
              </div>
              <div class="mb-3">
                <form-label for="input-lastname">{{ entry_lastname }}</form-label>
                <input-text id="input-lastname" label="{{ entry_lastname }}" name="lastname" value="{{ lastname }}" required></input-text>
              </div>
              <div class="mb-3">
                <form-label for="input-email">{{ entry_email }}</form-label>
                <input-email id="input-email" label="{{ entry_email }}" name="email" value="{{ email }}" required></input-email>
              </div>
              {% if not config_telephone_status %}
              <div class="mb-3">
                <form-label for="input-telephone">{{ entry_telephone }}</form-label>
                <input-tel id="input-telephone" label="{{ entry_telephone }}" name="telephone" value="{{ telephone }}" {% if config_telephone_required %} required{% endif %}></input-tel>
              </div>
              {% endif %}
            </fieldset>
            <div class="text-end">
              <button-submit @ref="submitter" @custom-click="submit">{{ button_continue }}</button-submit>
            </div>
          </template>
        </form-submit>
      </div>
    </div>
  </div>
