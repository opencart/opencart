<form id="form-register" @submit="handleSubmit">
  <p>{{ text_login }}</p>
  <fieldset>
    <legend>{{ heading_title }}</legend>
    <div class="row" {% if not config_checkout_guest %} hidden{% endif %}>
      <div class="col mb-3">
        <div class="form-check form-check-inline">
          <input type="radio" name="account" value="1" id="input-register" class="form-check-input" {% if account %} checked{% endif %} />
          <label for="input-register" class="form-check-label">{{ text_register }}</label>
        </div>
        <div class="form-check form-check-inline">
          <input type="radio" name="account" value="0" id="input-guest" class="form-check-input" {% if not account %} checked{% endif %} />
          <label for="input-guest" class="form-check-label">{{ text_guest }}</label>
        </div>
      </div>
    </div>
    <div class="row row-cols-1 row-cols-md-2">
      <div class="col mb-3">
        <input-text label="{{ entry_firstname }}" name="firstname" value="{{ firstname }}" required></input-text>
      </div>
      <div class="col mb-3">
        <input-text label="{{ entry_lastname }}" name="lastname" value="{{ lastname }}" required></input-text>
      </div>
      <div class="col mb-3">
        <input-text label="{{ entry_email }}" name="email" value="{{ email }}" required></input-text>
      </div>
      <div class="col mb-3" {% if config_telephone_status %} hidden{% endif %}>
        <input-text label="{{ entry_telephone }}" name="telephone" value="{{ telephone }}" {% if config_telephone_required %} required{% endif %}></input-text>
      </div>
    </div>
  </fieldset>
  <div class="row row-cols-1 row-cols-md-2">
    <div id="password" class="col mb-2">
      <fieldset>
        <legend>{{ text_your_password }}</legend>
        <div class="row">
          <div class="col mb-3">
            <input-password label="{{ entry_password }}" name="password" value="" required></input-password>
          </div>
        </div>
      </fieldset>
    </div>
    <div class="col mb-3">{{ captcha }}</div>
  </div>
  <div class="mb-3">
    <div><input-switch label="{{ entry_newsletter }}" name="newsletter" value="1"></input-switch></div>
    <div><input-switch label="{{ text_agree }}" name="agree" value="1" {% if not text_agree %} hidden{% endif %}></input-switch></div>
  </div>
  <button-submit id="button-register" class="mt-2">{{ button_continue }}</button-submit>
</form>
