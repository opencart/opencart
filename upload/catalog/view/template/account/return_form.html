<h1>{{ heading_title }}</h1>
<p>{{ text_description }}</p>
<form-submit @submit="handleSubmit">
  <fieldset>
    <legend>{{ text_order }}</legend>
    <div class="mb-3">
      <input-text label="{{ entry_order_id }}" name="order_id" value="{{ order_id }}" required></input-text>
    </div>
    <div class="mb-3">
      <input-date label="{{ entry_date_ordered }}" name="date_ordered" value="{{ date_ordered }}"></input-date>
    </div>
  </fieldset>
  <fieldset>
    <legend>{{ text_customer }}</legend>
    <div class="mb-3">
      <input-text label="{{ entry_firstname }}" name="firstname" value="{{ firstname }}" required></input-text>
    </div>
    <div class="mb-3">
      <input-text label="{{ entry_lastname }}" name="lastname" value="{{ lastname }}" required></input-text>
    </div>
    <div class="mb-3">
      <input-email label="{{ entry_email }}" name="email" value="{{ email }}" required></input-email>
    </div>
    {% if config_telephone_status %}
    <div class="mb-3">
      <input-tel label="{{ entry_telephone }}" name="telephone" value="{{ telephone }}" {% if config_telephone_required %} required{% endif %}></input-tel>
    </div>
    {% endif %}
  </fieldset>
  <fieldset>
    <legend>{{ text_product }}</legend>
    <div class="mb-3">
      <label for="input-product" class="col-sm-2 col-form-label">{{ entry_product }}</label>
      <input type="hidden" name="product_id" value="{{ product_id }}" />
      <input-text label="{{ entry_product }}" name="product" value="{{ product }}" required></input-text>
    </div>
    <div class="mb-3">
      <input-text label="{{ entry_model }}" name="model" value="{{ model }}" required></input-text>
    </div>
    <div class="mb-3">
      <input-number label="{{ entry_quantity }}" name="quantity" value="1" required></input-number>
    </div>
    <div class="row mb-3">
      <label class="col-sm-2 col-form-label required">{{ entry_reason }}</label>
      <div class="col-sm-10">
        <div id="input-reason">
          {% for return_reason in return_reasons %}
          <div class="form-check">
            <input type="radio" name="return_reason_id" value="{{ return_reason.return_reason_id }}" id="input-return-reason-{{ return_reason.return_reason_id }}" class="form-check-input" />
            <label for="input-return-reason-{{ return_reason.return_reason_id }}" class="form-check-label">{{ return_reason.name }}</label>
          </div>
          {% endfor %}
        </div>
        <div id="error-reason" class="invalid-feedback"></div>
      </div>
    </div>
    <div class="row mb-3">
      <label class="col-sm-2 col-form-label required">{{ entry_opened }}</label>
      <div class="col-sm-10">
        <div class="form-check form-check-inline">
          <input type="radio" name="opened" value="1" id="input-opened-yes" class="form-check-input" checked />
          <label for="input-opened-yes" class="form-check-label">{{ text_yes }}</label>
        </div>
        <div class="form-check form-check-inline">
          <input type="radio" name="opened" value="0" id="input-opened-no" class="form-check-input" />
          <label for="input-opened-no" class="form-check-label">{{ text_no }}</label>
        </div>
      </div>
    </div>
    <div class="row mb-3">
      <label for="input-comment" class="col-sm-2 col-form-label">{{ entry_fault_detail }}</label>
      <div class="col-sm-10">
        <textarea name="comment" rows="5" placeholder="{{ entry_fault_detail }}" id="input-comment" class="form-control"></textarea>
      </div>
    </div> {{ captcha }}
  </fieldset>
  <div class="row">
    <div class="col-3"><a href="account/account.js" :click="link" class="btn btn-light">{{ button_back }}</a></div>
    <div class="col text-end">
      {% if text_agree %}
      <label for="input-agree" class="form-check-label">{{ text_agree }}</label>
      <input-switch name="agree" value="1" input-id="input-agree"></input-switch>
      {% endif %}
      <button-submit class="btn btn-primary">{{ button_submit }}</button-submit>
    </div>
  </div>
</form-submit>
