<h1>{{ heading_title }}</h1>
<form-submit @ref="form" @[submit]="handleSubmit">
  <template>
    <fieldset>
      <div class="mb-3">
        <input-text label="{{ entry_firstname }}" name="firstname" value="{{ firstname }}" required></input-text>
      </div>
      <div class="mb-3 ">
        <input-text label="{{ entry_lastname }}" name="lastname" value="{{ lastname }}" required></input-text>
      </div>
      <div class="mb-3">
        <input-text label="{{ entry_company }}" name="company" value="{{ company }}"></input-text>
      </div>
      <div class="mb-3">
        <input-text label="{{ entry_address_1 }}" name="address_1" value="{{ address_1 }}" required></input-text>
      </div>
      <div class="mb-3">
        <input-text label="{{ entry_address_2 }}" name="address_2" value="{{ address_2 }}"></input-text>
      </div>
      <div class="mb-3">
        <input-text label="{{ entry_city }}" name="city" value="{{ city }}" required></input-text>
      </div>
      <div class="mb-3">
        <input-text @ref="postcode" label="{{ entry_postcode }}" name="postcode" value="{{ postcode }}" required></input-text>
      </div>
      <div class="mb-3">
        <input-country @ref="country" label="{{ entry_country }}" name="country_id" value="{{ country_id }}" required>
          <option value="0">{{ text_select }}</option>
        </input-country>
      </div>
      <div class="mb-3">
        <input-zone @ref="zone" label="{{ entry_zone }}" name="zone_id" value="{{ zone_id }}" country_id="{{ country_id }}" required>
          <option value="0">{{ text_select }}</option>
        </input-zone>
      </div>
      <div class="mb-3">
        <input-switch label="{{ entry_default }}" name="default" value="{{ default }}"></input-switch>
      </div>
    </fieldset>
    <div class="text-end">
      <button-submit @ref="submitter" @[click]="submit">{{ button_continue }}</button-submit>
    </div>
  </template>
</form-submit>
