<h1>{{ heading_title }}</h1>
<form-submit @ref="form" @custom-submit="handleSubmit">
  <template>
    <fieldset>
      <legend>{{ text_password }}</legend>
      <div class="mb-3">
        <input-password label="{{ entry_password }}" name="password" value="" required></input-password>
      </div>
      <div class="mb-3">
        <input-password label="{{ entry_confirm }}" name="confirm" value="" required></input-password>
      </div>
    </fieldset>
    <div class="text-end">
      <button-submit @ref="submitter" @custom-click="submit">{{ button_continue }}</button-submit>
    </div>
  </template>
</form-submit>
