<h1>{{ heading_title }}</h1>
<p>{{ text_login }}</p>
<form-submit @ref="form" @custom-submit="handleSubmit">
  <template>
    <fieldset>
      <legend>{{ heading_title }}</legend>
      <div class="row row-cols-1 row-cols-md-2">
        <div class="mb-3 col">
          <input-text label="{{ entry_firstname }}" name="firstname" value="{{ firstname }}" required></input-text>
        </div>
        <div class="mb-3 col">
          <input-text label="{{ entry_lastname }}" name="lastname" value="{{ lastname }}" required></input-text>
        </div>
        <div class="mb-3 col">
          <input-text label="{{ entry_email }}" name="email" value="{{ email }}" required></input-text>
        </div>
        <div class="mb-3 col" {% if not config_telephone_status %}hidden{% endif %}>
          <input-text label="{{ entry_telephone }}" name="telephone" value="{{ telephone }}" {% if config_telephone_required %}required{% endif %}></input-text>
        </div>
      </div>
    </fieldset>
    <div class="row row-cols-1 row-cols-md-2" {% if not account %}hidden{% endif %}>
      <div class="col mb-2">
        <fieldset>
          <legend>{{ text_your_password }}</legend>
          <div class="row">
            <div class="col mb-3">
              <input-password label="{{ entry_password }}" name="password" value="" required></input-password>
            </div>
          </div>
        </fieldset>
      </div>
      <div class="col mb-3"><account-captcha type="{{ config_captcha }}" {% if not config_captcha %}hidden{% endif %}></account-captcha></div>
    </div>
    <div class="mb-3">
      <div><input-switch label="{{ entry_newsletter }}" name="newsletter" value="1"></input-switch></div>
      <div><input-switch label="{{ text_agree }}" name="agree" value="1" {% if not config_account_id || not account %}hidden{% endif %}></input-switch></div>
    </div>
    <input type="hidden" name="account" value="{{ account }}" />
    <button-submit @ref="submitter" @custom-click="submit" class="mt-2">{{ button_continue }}</button-submit>
  </template>
</form-submit>
