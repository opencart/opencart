<h1>{{ heading_title }}</h1>
<form id="form-password" action="{{ save }}" data-on="submit:onSubmit">
  <fieldset>
    <legend>{{ text_password }}</legend>
    <div class="row mb-3">
      <label for="input-password" class="col-md-3 col-form-label">{{ entry_password }}</label>
      <div class="col-md-9">
        <input type="password" name="password" value="" placeholder="{{ entry_password }}" id="input-password" class="form-control" required autocomplete="new-password"/>
        <div id="error-password" class="invalid-feedback"></div>
      </div>
    </div>
    <div class="row mb-3">
      <label for="input-confirm" class="col-md-3 col-form-label">{{ entry_confirm }}</label>
      <div class="col-md-9">
        <input type="password" name="confirm" value="" placeholder="{{ entry_confirm }}" id="input-confirm" class="form-control" required/>
        <div id="error-confirm" class="invalid-feedback"></div>
      </div>
    </div>
  </fieldset>
  <div class="row">
    <div class="col">
      <a href="account/account.js" class="btn btn-light" data-on="click:onClick">{{ button_back }}</a>
    </div>
    <div class="col text-end">
      <button type="submit" class="btn btn-primary">{{ button_continue }}</button>
    </div>
  </div>
  </div>
</form>
