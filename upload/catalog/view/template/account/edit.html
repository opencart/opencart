<div class="modal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5>{{ heading_title }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form-submit @ref="form" @submit="handleSubmit">
          <div @ref="alert"></div>
          <fieldset>
            <legend>{{ text_your_details }}</legend>
            <div class="mb-3">
              <input-text label="{{ entry_firstname }}" name="firstname" value="{{ firstname }}" required></input-text>
            </div>
            <div class="mb-3">
              <input-text label="{{ entry_lastname }}" name="lastname" value="{{ lastname }}" required></input-text>
            </div>
            <div class="mb-3">
              <input-email label="{{ entry_email }}" name="email" value="{{ email }}" required></input-email>
            </div>
            <div class="mb-3" {% if not config_telephone_status %} hidden{% endif %}>
              <input-tel label="{{ entry_telephone }}" name="telephone" value="{{ telephone }}" {% if config_telephone_required %} required{% endif %}></input-tel>
            </div>
          </fieldset>
          <div class="text-end">
            <button-submit @ref="submitter">{{ button_continue }}</button-submit>
          </div>
        </form-submit>
      </div>
    </div>
  </div>
