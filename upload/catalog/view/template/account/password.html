<h1>{{ heading_title }}</h1>
<form @submit="handleSubmit">
  <fieldset>
    <legend>{{ text_password }}</legend>
    <div class="row mb-3">
      <div class="col-md-9">
        <input-password label="{{ entry_password }}" name="password" value="" required></input-password>
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-md-9">
        <input-password label="{{ entry_confirm }}" name="confirm" value="" required></input-password>
      </div>
    </div>
  </fieldset>
  <div class="row">
    <div class="col">
      <a href="account/account.js" :click="link" class="btn btn-light">{{ button_back }}</a>
    </div>
    <div class="col text-end">
      <button-submit @ref="submit">{{ button_continue }}</button-submit>
    </div>
  </div>
</form>
