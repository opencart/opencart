<h1>{{ heading_title }}</h1>
<p>{{ text_account_already | safe }}</p>
<form @ref="form" @submit="handleSubmit">
  <fieldset>
    <legend>{{ text_your_details }}</legend>
    <div class="mb-3">
      <input-text @ref="firstname" name="firstname" value="">
        <label slot="label">{{ entry_firstname }}</label>
      </input-text>
    </div>
    <div class="mb-3">
      <input-text @ref="lastname" name="lastname" value="">
         <label slot="label">{{ entry_lastname }}</label>
      </input-text>
    </div>
    <div class="mb-3">
      <input-email @ref="email" name="email" value="test123@test123.com">
        <label slot="label">{{ entry_email }}</label>
      </input-email>
    </div>
    {% if config_telephone_status %}
    <div class="mb-3">
      <input-tel @ref="telephone" name="telephone" value="0123456789"{% if config_telephone_required %} required{% endif %}>
        <label slot="label">{{ entry_telephone }}</label>
      </input-tel>
    </div>
    {% endif %}
  </fieldset>
  <fieldset>
    <legend>{{ text_your_password }}</legend>
    <div class="mb-3">
      <input-password @ref="password" name="password" value="1234567890" required>
        <label slot="label">{{ entry_password }}</label>
      </input-password>
    </div>
  </fieldset>
  <fieldset>
    <legend>{{ text_newsletter }}</legend>
    <div class="row mb-3">
      <input-switch @ref="newsletter" name="newsletter" value="1">
        <label slot="label">{{ entry_newsletter }}</label>
      </input-switch>
    </div>
  </fieldset>

  {% if config_captcha %}
  <account-captcha type="{{ config_captcha }}"></account-captcha>
  {% endif %}

  <div class="text-end">
    {% if config_account_id %}

    <input-switch name="agree" value="1" @ref="agree">
        <label slot="label">{{ text_agree }}</label>
    </input-switch>

    {% endif %}

    <button-submit @ref="submitter">{{ button_continue }}</button-submit>
  </div>
</form>
