<h1>{{ heading_title }}</h1>
<form id="form-reset" @submit="handleSubmit">
  <fieldset>
    <legend>{{ text_password }}</legend>
    <div class="row mb-3">
      <form-label for="input-password">{{ entry_password }}</form-label>
      <div class="col-sm-10">
        <input-password name="password" value="" id="input-password"/>
      </div>
    </div>
    <div class="row mb-3">
      <form-label for="input-confirm">{{ entry_confirm }}</form-label>
      <div class="col-sm-10">
        <input-password name="confirm" value="" id="input-confirm"/>
      </div>
    </div>
  </fieldset>
  <div class="row">
    <div class="col">
      <a href="account/login.js" :click="link" class="btn btn-light">{{ button_back }}</a>
    </div>
    <div class="col text-end">
      <button type="submit" class="btn btn-primary">{{ button_continue }}</button>
    </div>
  </div>
</form>
