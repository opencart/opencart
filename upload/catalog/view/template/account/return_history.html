<div class="table-responsive">
  <table class="table table-bordered table-hover">
    <thead>
      <tr>
        <th>{{ column_date_added }}</th>
        <th>{{ column_status }}</th>
        <th>{{ column_comment }}</th>
      </tr>
    </thead>
    <tbody class="{% if not histories %}d-none{% endif %}"> {% for history in histories %} <tr>
        <td>{{ history.date_added }}</td>
        <td>{{ history.status }}</td>
        <td>{{ history.comment }}</td>
      </tr> {% endfor %} </tbody>
    <tbody class="{% if histories %}d-none{% endif %}">
      <tr>
        <td colspan="3" class="text-center">{{ text_no_results }}</td>
      </tr>
    </tbody>
  </table>
</div>

<div class="row">

  <div class="col-sm-6 text-start">
    <nav-pagination href="{{ pagination }}" target="#list" page="{{ page }}" limit="{{ limit }}" total="{{ total }}"></nav-pagination>
  </div>

  <div class="col-sm-6 text-end">{{ results }}</div>
</div>
