<h1>{{ heading_title }}</h1>
<form @submit="handleSubmit">
  <fieldset>
    <div class="row mb-3 mb-0">
      <div class="col-md-9"><input-switch label="{{ entry_newsletter }}" name="newsletter" value="1" {% if newsletter %} checked{% endif %}></input-switch></div>
    </div>
  </fieldset>
  <div class="row">
    <div class="col">
      <a href="account/account.js" :click="link" class="btn btn-light">{{ button_back }}</a>
    </div>
    <div class="col text-end">
      <button type="submit" class="btn btn-primary">{{ button_continue }}</button>
    </div>
  </div>
</form>
