<h1>{{ heading_title }}</h1>
<img src="{{ image }}" alt="{{ heading_title }}" title="{{ heading_title }}" class="img-thumbnail mb-3" {% if not image %} hidden{% endif %} />
<div class="mb-3" {% if not description %}hidden{% endif %}>{{ description }}</div>
<hr />
<h3>{{ text_refine }}</h3>
<form-submit @submit="handleSubmit">
  <div class="input-group dropdown mb-3">
    <input type="text" name="search" value="{{ search }}" placeholder="{{ entry_search }}" id="input-search" class="form-control" />
    <select name="topic_id" id="input-topic" class="form-select" @change="handleChange" {% if not topics %} hidden{% endif %}>
      <option value="">{{ text_all }}</option>
      {% for topic in topics %}
      <option value="{{ topic.topic_id }}" {% if topic.topic_id == topic_id %} selected{% endif %}>{{ topic.name }}</option>
      {% endfor %}
    </select>
    <button-submit>{{ button_search }}</button-submit>
  </div>
</form-submit>
<article-list topic_id="{{ topic_id }}" sort="" order=""></article-list>
