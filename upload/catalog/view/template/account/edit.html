<div class="modal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5>{{ heading_title }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form-submit @ref="form">
          <template>
            <div @ref="alert"></div>
            <fieldset>
              <legend>{{ text_your_details }}</legend>
              <div class="mb-3">
                <input-text @ref="firstname" label="{{ entry_firstname }}" name="firstname" value="{{ firstname }}" required></input-text>
              </div>
              <div class="mb-3">
                <input-text @ref="lastname" label="{{ entry_lastname }}" name="lastname" value="{{ lastname }}" required></input-text>
              </div>
              <div class="mb-3">
                <input-email @ref="email" label="{{ entry_email }}" name="email" value="{{ email }}" required></input-email>
              </div>
              {% if not config_telephone_status %}
              <div class="mb-3">
                <input-tel @ref="telephone" label="{{ entry_telephone }}" name="telephone" value="{{ telephone }}" {% if config_telephone_required %} required{% endif %}></input-tel>
              </div>
              {% endif %}
            </fieldset>
            <div class="text-end">
              <button-submit @ref="submitter">{{ button_continue }}</button-submit>
            </div>
          </template>
        </form-submit>
      </div>
    </div>
  </div>
