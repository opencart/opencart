<fieldset id="shipping-address" class="{% if payment_address_required and not addresses %}d-none{% else %}d-block{% endif %}">
  <legend>{{ heading_title }}</legend>

  <div id="shipping-addresses" class="{% if addresses %}d-block{% else %}d-none{% endif %}">
    <div class="form-check">
      <input type="radio" name="existing" value="1" id="input-shipping-existing" @change="existing" class="form-check-input"{% if addresses %} checked{% endif %}/>
      <label for="input-shipping-existing" class="form-check-label">{{ text_address_existing }}</label>
    </div>
    <div class="form-check">
      <input type="radio" name="existing" value="0" id="input-shipping-new" @change="existing" class="form-check-input"{% if not addresses %} checked{% endif %}/>
      <label for="input-shipping-new" class="form-check-label">{{ text_address_new }}</label>
    </div>
  </div>

  <div id="shipping-existing" class="{% if addresses %}d-block{% else %}d-none{% endif %}">
    <select name="address_id" id="input-shipping-address" class="form-select" @change="handleChange">
      <option value="">{{ text_select }}</option>
      {% for address in addresses %}
        <option value="{{ address.address_id }}"{% if address.address_id == address_id %} selected{% endif %}>{{ address.firstname }} {{ address.lastname }},{% if address.company %} {{ address.company }},{% endif %} {{ address.address_1 }}, {{ address.city }}, {{ address.zone }}, {{ address.country }}</option>
      {% endfor %}
    </select>
    <div id="error-shipping-address" class="invalid-feedback"></div>
  </div>
  <br/>

  <div id="shipping-new" class="{% if not addresses %}d-block{% else %}d-none{% endif %}">
    <form id="form-shipping-address" @submit="handleSubmit">
      <div class="row row-cols-1 row-cols-md-2">
        <div class="col mb-3">
          <label for="input-shipping-firstname" class="form-label">{{ entry_firstname }}</label >
          <input type="text" name="firstname" value="" placeholder="{{ entry_firstname }}" id="input-firstname" class="form-control" required/>
          <div id="error-shipping-firstname" class="invalid-feedback"></div>
        </div>
        <div class="col mb-3">
          <label for="input-shipping-lastname" class="form-label">{{ entry_lastname }}</label>
          <input type="text" name="lastname" value="" placeholder="{{ entry_lastname }}" id="input-lastname" class="form-control" required/>
          <div id="error-shipping-lastname" class="invalid-feedback"></div>
        </div>
        <div class="col mb-3">
          <label for="input-shipping-company" class="form-label">{{ entry_company }}</label>
          <input type="text" name="company" value="" placeholder="{{ entry_company }}" id="input-company" class="form-control"/>
        </div>
        <div class="col mb-3">
          <label for="input-shipping-address-1" class="form-label">{{ entry_address_1 }}</label>
          <input type="text" name="address_1" value="" placeholder="{{ entry_address_1 }}" id="input-address-1" class="form-control" required/>
          <div id="error-shipping-address-1" class="invalid-feedback"></div>
        </div>
        <div class="col mb-3">
          <label for="input-shipping-address-2" class="form-label">{{ entry_address_2 }}</label>
          <input type="text" name="address_2" value="" placeholder="{{ entry_address_2 }}" id="input-address-2" class="form-control"/>
        </div>
        <div class="col mb-3">
          <label for="input-city" class="form-label">{{ entry_city }}</label>
          <input type="text" name="city" value="" placeholder="{{ entry_city }}" id="input-city" class="form-control" required/>
          <div id="error-city" class="invalid-feedback"></div>
        </div>
        <div class="col mb-3">
          <label for="input-postcode" class="form-label">{{ entry_postcode }}</label>
          <input type="text" name="postcode" value="{{ postcode }}" placeholder="{{ entry_postcode }}" id="input-postcode" class="form-control" required/>
          <div id="error-postcode" class="invalid-feedback"></div>
        </div>

        <div class="col mb-3">
          <label for="input-country" class="form-label">{{ entry_country }}</label>
          <input-country name="country_id" value="{{ country_id }}" id="input-country" postcode="1" target="input-postcode" input-id="input-country" required>
            <option value="0">{{ text_select }}</option>
          </input-country>
          <div id="error-country" class="invalid-feedback"></div>
        </div>

        <div class="col mb-3">
          <label for="input-zone" class="form-label">{{ entry_zone }}</label>
          <input-zone name="zone_id" value="{{ zone_id }}" id="input-zone" required>
            <option value="0">{{ text_select }}</option>
          </input-zone>
          <div id="error-zone" class="invalid-feedback"></div>
        </div>
      </div>

      <div class="text-end mb-3">
        <button type="submit" id="button-address" class="btn btn-primary">{{ button_continue }}</button>
      </div>

    </form>
  </div>
</fieldset>
