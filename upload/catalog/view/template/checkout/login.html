<div class="row">
  <div class="col">
    <div class="border rounded p-3 d-flex flex-column h-100">
      <form-submit @ref="form" @custom-submit="handleSubmit">
        <template>
          <div @ref="alert"></div>
          <h2>{{ text_returning_customer }}</h2>
          <p><strong>{{ text_i_am_returning_customer }}</strong></p>
          <div class="mb-3">
            <input-email label="{{ entry_email }}" name="email" value=""></input-email>
          </div>
          <div class="mb-3">
            <input-password label="{{ entry_password }}" name="password" value="" class="mb-1"></input-password>
            <a href="account/forgotten.js" :click="dialog">{{ text_forgotten }}</a>
          </div>
          <div class="text-end">
            <button-submit @ref="submitter" @custom-click="submit">{{ button_login }}</button-submit>
          </div>
        </template>
      </form-submit>
    </div>
  </div>
  <div class="col mb-3">
    <div class="border rounded p-3 d-flex flex-column h-100">
      <h2>{{ text_new_customer }}</h2>
      <p><strong>{{ text_register }}</strong></p>
      <p>{{ text_register_account }}</p>
      <a href="checkout/register.js?account=register" :click="dialog" class="btn btn-primary mb-3">REGISTER</a>
      <hr />
      <a href="checkout/register.js?account=guest" :click="dialog" class="btn btn-primary">GUEST CHECKOUT</a>
    </div>
  </div>
</div>
