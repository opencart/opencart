<h1>{{ name }}</h1>
<img src="{{ image }}" alt="{{ name }}" title="{{ name }}" class="img-thumbnail mb-2" {% if not image %} hidden{% endif %} />
<p>{{ text_by }} <a href="cms/topic.js?author={{ author }}" :click="link">{{ author }}</a> - {{ date_added }} - {{ comment_total }} {{ text_comment }}</p>
<div>{{ description }}</div>
<p{% if not tags %} hidden{% endif %}>{{ text_tags }} {% for tag in tags %}<a href="catalog/search?tag={{ tag.tag }}">{{ tag.tag }}</a>{% if not loop.last %},{% endif %}{% endfor %}</p>
