<fieldset id="shipping-address" {% if payment_address_required and not addresses %} hidden{% endif %}>
  <legend>{{ heading_title }}</legend>
  <div id="shipping-addresses" {% if !addresses %}hidden{% endif %}>
    <div class="form-check">
      <input type="radio" name="existing" value="1" id="input-shipping-existing" @change="existing" class="form-check-input" {% if addresses %} checked{% endif %} />
      <label for="input-shipping-existing" class="form-check-label">{{ text_address_existing }}</label>
    </div>
    <div class="form-check">
      <input type="radio" name="existing" value="0" id="input-shipping-new" @change="existing" class="form-check-input" {% if not addresses %} checked{% endif %} />
      <label for="input-shipping-new" class="form-check-label">{{ text_address_new }}</label>
    </div>
  </div>
  <div id="shipping-existing" {% if !addresses %}hidden{% endif %}>
    <select name="address_id" id="input-shipping-address" class="form-select" @change="handleChange">
      <option value="">{{ text_select }}</option>
      {% for address in addresses %}
      <option value="{{ address.address_id }}" {% if address.address_id == address_id %} selected{% endif %}>{{ address.firstname }} {{ address.lastname }},{% if address.company %} {{ address.company }},{% endif %} {{ address.address_1 }}, {{ address.city }}, {{ address.zone }}, {{ address.country }}</option>
      {% endfor %}
    </select>
    <div id="error-shipping-address" class="invalid-feedback"></div>
  </div>
  <br />
  <div id="shipping-new" {% if !addresses %}hidden{% endif %}>
    <form-submit @ref="form">
      <div class="row row-cols-1 row-cols-md-2">
        <div class="col mb-3">
          <input-text label="{{ entry_firstname }}" name="firstname" value="" required></input-text>
        </div>
        <div class="col mb-3">
          <input-text label="{{ entry_lastname }}" name="lastname" value="" required></input-text>
        </div>
        <div class="col mb-3">
          <input-text label="{{ entry_company }}" name="company" value=""></input-text>
        </div>
        <div class="col mb-3">
          <input-text label="{{ entry_address_1 }}" name="address_1" value="" required></input-text>
        </div>
        <div class="col mb-3">
          <input-text label="{{ entry_address_2 }}" name="address_2" value=""></input-text>
        </div>
        <div class="col mb-3">
          <input-text label="{{ entry_city }}" name="city" value="" required></input-text>
        </div>
        <div class="col mb-3">
          <input-text label="{{ entry_postcode }}" name="postcode" value="{{ postcode }}" required></input-text>
        </div>
        <div class="col mb-3">
          <input-country label="{{ entry_country }}" name="country_id" value="{{ country_id }}" id="input-country" postcode="1" target="input-postcode" required>
            <option value="0">{{ text_select }}</option>
          </input-country>
        </div>
        <div class="col mb-3">
          <input-zone label="{{ entry_zone }}" name="zone_id" value="{{ zone_id }}" id="input-zone" required>
            <option value="0">{{ text_select }}</option>
          </input-zone>
        </div>
      </div>
      <div class="text-end mb-3">
        <button-submit @ref="submitter">{{ button_continue }}</button-submit>
      </div>
    </form-submit>
  </div>
</fieldset>
